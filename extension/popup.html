<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #1f2937; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
  #fill { background: #2563eb; color: #fff; font-weight: 600; }
  #fill:hover { background: #1d4ed8; }
  #edit { background: #f3f4f6; margin-top: 8px; }
  label { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 10px; }
  #status { font-size: 12px; margin-top: 10px; line-height: 1.4; }
  .legend { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.5; }
  .g { color: #16a34a; font-weight: 600; } .y { color: #d97706; font-weight: 600; }
</style>
</head>
<body>
  <h1>Job Apply Autofill</h1>
  <button id="fill">Fill this page</button>
  <button id="edit">Edit my profile</button>
  <label><input type="checkbox" id="overwrite"> Overwrite fields that already have text</label>
  <div id="status"></div>
  <div class="legend"><span class="g">Green</span> = filled. <span class="y">Orange dashed</span> = needs you.<br>Shortcut: Alt+Shift+F</div>
  <script src="popup.js"></script>
</body>
</html>
